name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Base de datos de prueba del job (el contenedor de servicios expone 5432).
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/poseidon

jobs:
  backend:
    name: "Backend: build + jest"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: poseidon
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente Prisma
        run: npx prisma generate

      - name: Aplicar migraciones
        run: npx prisma migrate deploy

      - name: Compilar
        run: npm run build

      - name: Tests unitarios
        run: npm test

  frontend:
    name: "Frontend: lint + build"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  e2e:
    name: "E2E: Playwright (Chromium)"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: poseidon
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      JWT_SECRET: ci-secret-de-pruebas-0123456789abcdef0123456789abcdef
      E2E_BROWSER: chromium
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Instalar dependencias (backend)
        run: npm ci

      - name: Instalar dependencias (frontend)
        run: npm ci
        working-directory: frontend

      - name: Generar cliente Prisma
        run: npx prisma generate

      - name: Aplicar migraciones
        run: npx prisma migrate deploy

      - name: Seed de datos de prueba
        run: npm run seed

      - name: Compilar backend (lo arranca Playwright)
        run: npm run build

      - name: Instalar Chromium de Playwright
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Tests E2E
        run: npx playwright test
        working-directory: frontend
